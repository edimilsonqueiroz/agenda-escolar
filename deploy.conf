# =============================================================================
#  deploy.conf — Configuração do Agenda Escolar em produção
#
#  Edite este arquivo ANTES de executar deploy.sh
#  Campos obrigatórios: GIT_REPO e SERVER_NAME
# =============================================================================

# --- Repositório Git ---------------------------------------------------------
# URL do repositório (HTTPS ou SSH)
GIT_REPO="https://github.com/edimilsonqueiroz/agenda-escolar.git"

# --- Servidor / Domínio ------------------------------------------------------
# Coloque aqui o domínio comprado quando tiver, ou o IP público do servidor
# Exemplos:
#   SERVER_NAME="agenda.minhaescola.com.br"
#   SERVER_NAME="203.0.113.10"
SERVER_NAME="SEU_DOMINIO_AQUI"

# --- Instalação --------------------------------------------------------------
APP_DIR="/opt/agenda_escolar"          # Onde o projeto será instalado
APP_USER="agenda"                      # Usuário de sistema criado para a app
GUNICORN_PORT="8000"                   # Porta interna do Gunicorn (não exposta)

# --- Banco de dados ----------------------------------------------------------
# Deixe em BRANCO para usar SQLite (recomendado para começar)
# Para PostgreSQL: DATABASE_URL="postgresql://usuario:senha@localhost/agenda"
DATABASE_URL=""

# --- Chave secreta Flask -----------------------------------------------------
# Deixe em BRANCO para gerar automaticamente (recomendado)
# Se definida manualmente, use uma string longa e aleatória
SECRET_KEY=""

# --- HTTPS com Certbot -------------------------------------------------------
# USE_SSL="sim"  →  instala certificado Let's Encrypt gratuitamente
# USE_SSL="nao"  →  instala apenas HTTP (você pode rodar novamente depois)
# ATENÇÃO: SSL só funciona com domínio real apontando para o servidor
USE_SSL="nao"

# E-mail do Certbot (obrigatório se USE_SSL="sim")
CERTBOT_EMAIL=""

# --- E-mail (opcional) -------------------------------------------------------
# Deixe MAIL_SERVER em branco para desabilitar envio de e-mails
MAIL_SERVER=""
MAIL_PORT="587"
MAIL_USERNAME=""
MAIL_PASSWORD=""
MAIL_DEFAULT_SENDER=""
