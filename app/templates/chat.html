{% extends "base.html" %}
{% block title %}Chat ao Vivo | Agenda Escolar{% endblock %}
{% block page_title %}Chat ao Vivo{% endblock %}

{% block content %}
<div class="chat-page reveal">
  <div class="chat-page-sidebar">
    <div class="chat-sidebar-tabs">
      <button class="chat-tab-btn chat-tab-btn--active" data-tab="online" title="Usuários online">
        <i class="fa-solid fa-users"></i>
        <span>Online</span>
      </button>
      <button class="chat-tab-btn" data-tab="dms" title="Mensagens diretas">
        <i class="fa-solid fa-comments"></i>
        <span>Conversas</span>
      </button>
    </div>

    <div id="chat-online-panel" class="chat-sidebar-panel chat-sidebar-panel--active">
      <div class="chat-sidebar-header">Online agora</div>
      <ul id="online-users" class="online-list"></ul>
    </div>
    <div id="chat-dms-panel" class="chat-sidebar-panel">
      <div class="chat-sidebar-header">Conversas</div>
      <ul id="dm-list" class="dm-list"></ul>
    </div>
  </div>

  <div class="chat-page-main">
    <div class="chat-page-topbar">
      <h3 id="chat-title">Chat ao Vivo</h3>
      <button id="chat-back-btn" class="btn btn-outline btn-sm" style="display:none;" type="button">
        ← Voltar ao geral
      </button>
    </div>
    <div id="chat-messages" class="chat-messages chat-messages--page"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="1000" placeholder="Escreva uma mensagem..." required autocomplete="off">
      <button class="btn btn-primary" type="submit">Enviar</button>
    </form>
    <input type="hidden" id="current-dm-recipient" value="">
  </div>
</div>
{% endblock %}
